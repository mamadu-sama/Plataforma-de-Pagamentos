services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fintouch
      POSTGRES_USER: fintouch
      POSTGRES_PASSWORD: fintouch
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintouch -d fintouch"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: fintouch
      DB_USER: fintouch
      DB_PASSWORD: fintouch
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

